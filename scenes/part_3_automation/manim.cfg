[CLI]
# Premium dark theme background color
background_color = #121212

# Default render quality: low (l), medium (m), high (h), or 4k (k)
quality = h

# Output directories configuration
media_dir = ./media
video_dir = {media_dir}/videos
images_dir = {media_dir}/images
tex_dir = {media_dir}/Tex

# Default LaTeX compiler to support XeLaTeX natively
tex_compiler = xelatex

# Frame size options
frame_width = 16
frame_height = 9

# Resolution and frame rate configuration
pixel_width = 1920
pixel_height = 1080
frame_rate = 30
